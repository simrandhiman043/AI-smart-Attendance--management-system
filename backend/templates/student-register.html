<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | AI Smart Attendance Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ===== Navigation Bar ===== -->
    <header class="navbar">
        <div class="logo">AI Attendance System</div>

        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}#home">Home</a></li>
                <li><a href="{{ url_for('home') }}#features">Features</a></li>
                <li><a href="{{ url_for('home') }}#about">About</a></li>
                <li><a href="{{ url_for('home') }}#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== Student Registration Section ===== -->
    <section class="login-wrapper">
        <div class="login-card">
            <h1>Student Registration</h1>

            <form action="{{ url_for('student_registration.register_student') }}" method="POST">

                <!-- Full Name field -->
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <!-- Email field -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <!-- Password field -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <!-- Roll Number field -->
                <div class="input-group">
                    <label for="roll_number">Roll Number</label>
                    <input type="text" id="roll_number" name="roll_number" placeholder="Enter your roll number" required>
                </div>

                <!-- Semester field -->
                <div class="input-group">
                    <label for="semester">Semester</label>
                    <input type="number" id="semester" name="semester" placeholder="Enter your current semester" min="1" max="8" required>
                </div>

                <!-- Register button -->
                <button type="submit" class="btn-primary">Register</button>
            </form>

            <!-- Back to Home button, redirects to landing page -->
            <a href="{{ url_for('home') }}" class="btn-secondary">Back to Home</a>
        </div>
    </section>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <p>&copy; 2026 AI Smart Attendance Management System. All rights reserved.</p>
    </footer>

</body>
</html>
