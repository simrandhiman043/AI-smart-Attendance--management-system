<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Student Registration | AI Smart Attendance Management System
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ===== Navigation Bar ===== -->
    <header class="navbar">

        <div class="logo">
            AI Attendance System
        </div>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="{{ url_for('home') }}#home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('home') }}#features">
                        Features
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('home') }}#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('home') }}#contact">
                        Contact
                    </a>
                </li>

            </ul>
        </nav>

    </header>


    <!-- ===== Student Registration Section ===== -->

    <section class="login-wrapper">

        <div class="login-card">

            <h1>
                Student Registration
            </h1>


            <form
                action="{{ url_for('student_registration.register_student') }}"
                method="POST"
            >


                <!-- Full Name -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Roll Number -->

                <div class="input-group">

                    <label for="roll_number">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll_number"
                        name="roll_number"
                        placeholder="Enter your roll number"
                        required
                    >

                </div>


                <!-- Semester -->

                <div class="input-group">

                    <label for="semester">
                        Semester
                    </label>

                    <input
                        type="number"
                        id="semester"
                        name="semester"
                        placeholder="Enter your current semester"
                        min="1"
                        max="8"
                        required
                    >

                </div>


                <!-- Stream -->

                <label for="stream_id">
                    Stream
                </label>

                <select
                    name="stream_id"
                    id="stream_id"
                    required
                >

                    <option value="">
                        Select your stream
                    </option>

                    <option value="1">
                        BCA
                    </option>

                    <option value="2">
                        B.Com
                    </option>

                    <option value="3">
                        BBA
                    </option>

                    <option value="4">
                        B.Sc
                    </option>

                    <option value="5">
                        B.A.
                    </option>

                    <option value="6">
                        B.Tech
                    </option>

                    <option value="7">
                        B.Voc
                    </option>

                    <option value="8">
                        B.Pharm
                    </option>

                    <option value="9">
                        LL.B
                    </option>

                    <option value="10">
                        B.Ed
                    </option>

                    <option value="11">
                        MCA
                    </option>

                    <option value="12">
                        M.Com
                    </option>

                    <option value="13">
                        MBA
                    </option>

                    <option value="14">
                        M.Sc
                    </option>

                    <option value="15">
                        M.A.
                    </option>

                    <option value="16">
                        M.Tech
                    </option>

                </select>


                <!-- Section -->

                <div class="input-group">

                    <label for="section">
                        Section
                    </label>

                    <select
                        name="section"
                        id="section"
                        required
                    >

                        <option value="">
                            Select your section
                        </option>

                        <option value="A">
                            Section A
                        </option>

                        <option value="B">
                            Section B
                        </option>

                        <option value="C">
                            Section C
                        </option>

                        <option value="D">
                            Section D
                        </option>

                    </select>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Register
                </button>

            </form>


            <!-- Back to Home -->

            <a
                href="{{ url_for('home') }}"
                class="btn-secondary"
            >
                Back to Home
            </a>

        </div>

    </section>


    <!-- ===== Footer ===== -->

    <footer class="footer">

        <p>
            &copy; 2026 AI Smart Attendance Management System.
            All rights reserved.
        </p>

    </footer>

</body>

</html>
