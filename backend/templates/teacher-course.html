<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | AI Smart Attendance Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="navbar">
        <div class="logo">AI Attendance System</div>

        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('home') }}#features">Features</a></li>
                <li><a href="{{ url_for('home') }}#about">About</a></li>
                <li><a href="{{ url_for('home') }}#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-wrapper">

        <div class="login-card">

            <h1>Add Course</h1>

            <form action="{{ url_for('course_management.teacher_course') }}" method="POST">

                <div class="input-group">
                    <label for="course_name">Course Name</label>
                    <input
                        type="text"
                        id="course_name"
                        name="course_name"
                        placeholder="Enter course name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="course_code">Course Code</label>
                    <input
                        type="text"
                        id="course_code"
                        name="course_code"
                        placeholder="Enter course code"
                        required
                    >
                </div>

                

                <button type="submit" class="btn-primary">
                    Add Course
                </button>

            </form>

            <a href="{{ url_for('home') }}" class="btn-secondary">
                Back to Home
            </a>

        </div>

    </section>

    <footer class="footer">
        <p>&copy; 2026 AI Smart Attendance Management System. All rights reserved.</p>
    </footer>

</body>
</html>
