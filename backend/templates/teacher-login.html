<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login | AI Smart Attendance Management System</title>

    <!-- Reusing the same stylesheet as the landing page and student login page -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ===== Navigation Bar (same as landing page) ===== -->
    <header class="navbar">
        <div class="logo">AI Attendance System</div>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== Teacher Login Section ===== -->
    <!-- Reuses the same .login-wrapper / .login-card classes as student-login.html -->
    <section class="login-wrapper">
        <div class="login-card">
            <h1>Teacher Login</h1>

            <form method="POST" action="{{ url_for('teacher_login') }}">
                <!-- Email field -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <!-- Password field -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <!-- Login button -->
                <button type="submit" class="btn-primary">Login</button>
            </form>

            <!-- Back to Home button, redirects to landing page -->
            <a href="{{ url_for('home') }}" class="btn-secondary">Back to Home</a>
        </div>
    </section>

    <!-- ===== Footer (same as landing page) ===== -->
    <footer class="footer">
        <p>&copy; 2026 AI Smart Attendance Management System. All rights reserved.</p>
    </footer>

</body>
</html>
